<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal OS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header id="header">
    <div class="header-left">
      <h1 id="greeting"></h1>
      <p id="date-line"></p>
    </div>
    <div id="meeting-banner" class="meeting-banner hidden">
      <span class="meeting-dot"></span>
      <span id="meeting-label"></span>
      <a id="meeting-join" href="#" target="_blank" class="join-btn">Join</a>
    </div>
    <button class="settings-btn" onclick="UI.openSettings()">⚙</button>
  </header>

  <!-- ── Main Grid ───────────────────────────────────────────────────────── -->
  <main class="grid">

    <!-- Tasks -->
    <section class="card" id="card-tasks">
      <div class="card-header">
        <h2>Do This Now</h2>
        <button class="pill-btn" onclick="UI.openTask()">+ Task</button>
      </div>
      <div id="task-suggestion" class="suggestion hidden"></div>
      <div id="task-list" class="item-list"></div>
    </section>

    <!-- Calendar -->
    <section class="card" id="card-calendar">
      <div class="card-header">
        <h2>Today's Calendar</h2>
        <button class="pill-btn" id="cal-btn" onclick="Calendar.connect()">Connect</button>
      </div>
      <div id="calendar-body"></div>
    </section>

    <!-- Buy List -->
    <section class="card" id="card-buy">
      <div class="card-header">
        <h2>Buy List</h2>
        <button class="pill-btn" onclick="UI.openBuy()">+ Add</button>
      </div>
      <div class="tab-bar">
        <button class="tab active" data-tab="all"      onclick="BuyList.switchTab('all',this)">All</button>
        <button class="tab"        data-tab="urgent"   onclick="BuyList.switchTab('urgent',this)">Urgent</button>
        <button class="tab"        data-tab="groceries"onclick="BuyList.switchTab('groceries',this)">Groceries</button>
        <button class="tab"        data-tab="someday"  onclick="BuyList.switchTab('someday',this)">Someday</button>
      </div>
      <div id="buy-list" class="item-list"></div>
    </section>

    <!-- Jobs -->
    <section class="card" id="card-jobs">
      <div class="card-header">
        <h2>Job Applications</h2>
        <button class="pill-btn" onclick="UI.openJob()">+ Log</button>
      </div>
      <div class="jobs-meta">
        <div class="jobs-count">
          <span id="jobs-today">0</span>
          <span class="jobs-sep">/</span>
          <span id="jobs-goal-display">20</span>
          <span class="jobs-label">today</span>
          <span id="jobs-streak" class="streak"></span>
        </div>
        <button class="link-btn" onclick="UI.openSettings('jobs')">Edit goal</button>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="jobs-bar"></div>
      </div>
      <div id="jobs-heatmap" class="heatmap"></div>
      <div id="jobs-recent" class="item-list small"></div>
    </section>

    <!-- Assets -->
    <section class="card" id="card-assets">
      <div class="card-header">
        <h2>Assets &amp; Goals</h2>
        <div class="header-actions">
          <button class="pill-btn" onclick="UI.openAsset()">+ Asset</button>
          <button class="pill-btn secondary" onclick="UI.openGoal()">+ Goal</button>
        </div>
      </div>
      <div id="net-worth" class="net-worth"></div>
      <div id="asset-list" class="asset-grid"></div>
      <div id="goal-list" class="goal-list"></div>
    </section>

  </main>

  <!-- ══════════════════════════════════════════════════════════════════════
       MODALS
  ══════════════════════════════════════════════════════════════════════ -->
  <div id="overlay" class="overlay hidden" onclick="UI.closeModal()"></div>

  <!-- Task Modal -->
  <div class="modal hidden" id="modal-task">
    <h3 id="modal-task-title">New Task</h3>
    <input type="hidden" id="task-edit-id" />
    <label>Task<input id="inp-task-text" type="text" placeholder="What needs to be done?" /></label>
    <label>Priority
      <select id="inp-task-priority">
        <option value="high">🔴 High</option>
        <option value="medium" selected>🟡 Medium</option>
        <option value="low">🟢 Low</option>
      </select>
    </label>
    <label>Due date (optional)<input id="inp-task-due" type="date" /></label>
    <label>Linked goal (optional)
      <select id="inp-task-goal"><option value="">— None —</option></select>
    </label>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="UI.closeModal()">Cancel</button>
      <button class="btn-primary"   onclick="Tasks.save()">Save</button>
    </div>
  </div>

  <!-- Buy Modal -->
  <div class="modal hidden" id="modal-buy">
    <h3>Add to Buy List</h3>
    <input type="hidden" id="buy-edit-id" />
    <label>Item name<input id="inp-buy-name" type="text" placeholder="e.g. Water bottle" /></label>
    <label>Category
      <select id="inp-buy-cat">
        <option value="urgent">🔴 Urgent</option>
        <option value="groceries">🛒 Groceries</option>
        <option value="someday" selected>💭 Someday</option>
      </select>
    </label>
    <label>Budget (optional)<input id="inp-buy-budget" type="text" placeholder="e.g. ₹500–800" /></label>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="UI.closeModal()">Cancel</button>
      <button class="btn-primary"   onclick="BuyList.save()">Save</button>
    </div>
  </div>

  <!-- Job Modal -->
  <div class="modal hidden" id="modal-job">
    <h3>Log Application</h3>
    <label>Company<input id="inp-job-company" type="text" placeholder="Company name" /></label>
    <label>Role<input id="inp-job-role" type="text" placeholder="Job title" /></label>
    <label>Platform<input id="inp-job-platform" type="text" placeholder="LinkedIn, Naukri, Indeed…" /></label>
    <label>Status
      <select id="inp-job-status">
        <option value="applied">Applied</option>
        <option value="screening">Screening</option>
        <option value="interview">Interview</option>
        <option value="offer">Offer</option>
        <option value="rejected">Rejected</option>
      </select>
    </label>
    <label>Notes<input id="inp-job-notes" type="text" placeholder="Optional notes" /></label>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="UI.closeModal()">Cancel</button>
      <button class="btn-primary"   onclick="Jobs.save()">Log</button>
    </div>
  </div>

  <!-- Asset Modal -->
  <div class="modal hidden" id="modal-asset">
    <h3 id="modal-asset-title">Add Asset</h3>
    <input type="hidden" id="asset-edit-id" />
    <label>Name<input id="inp-asset-name" type="text" placeholder="e.g. Gold, Zerodha, SBI Savings" /></label>
    <label>Type
      <select id="inp-asset-type" onchange="Assets.onTypeChange()">
        <option value="gold">Gold</option>
        <option value="stock">Stocks / MF</option>
        <option value="cash">Cash / Bank</option>
        <option value="crypto">Crypto</option>
        <option value="other">Other</option>
      </select>
    </label>
    <div id="gold-fields">
      <label>Quantity (grams)<input id="inp-asset-qty" type="number" step="0.01" placeholder="e.g. 10" /></label>
      <label>Buy price per gram (₹)<input id="inp-asset-buyprice" type="number" step="0.01" placeholder="e.g. 6800" /></label>
    </div>
    <div id="value-field" class="hidden">
      <label>Current value (₹)<input id="inp-asset-value" type="number" step="0.01" placeholder="e.g. 50000" /></label>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="UI.closeModal()">Cancel</button>
      <button class="btn-primary"   onclick="Assets.save()">Save</button>
    </div>
  </div>

  <!-- Goal Modal -->
  <div class="modal hidden" id="modal-goal">
    <h3>New Financial Goal</h3>
    <label>Goal name<input id="inp-goal-name" type="text" placeholder="e.g. Buy a car, Emergency fund" /></label>
    <label>Target amount (₹)<input id="inp-goal-target" type="number" placeholder="e.g. 500000" /></label>
    <label>Current saved (₹)<input id="inp-goal-current" type="number" placeholder="e.g. 120000" /></label>
    <label>Target date (optional)<input id="inp-goal-date" type="date" /></label>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="UI.closeModal()">Cancel</button>
      <button class="btn-primary"   onclick="Goals.save()">Save</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal hidden" id="modal-settings">
    <h3>Settings</h3>
    <label>Your name<input id="inp-name" type="text" placeholder="Pradeep" /></label>
    <label>Daily job application goal<input id="inp-jobs-goal" type="number" min="1" max="100" /></label>
    <label>Google Calendar Client ID
      <input id="inp-cal-id" type="text" placeholder="Paste your OAuth Client ID" />
      <small><a href="https://console.cloud.google.com/" target="_blank">Get one free from Google Cloud Console →</a></small>
    </label>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="UI.closeModal()">Cancel</button>
      <button class="btn-primary"   onclick="Settings.save()">Save</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
